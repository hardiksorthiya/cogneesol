<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- css -->
    <link rel="stylesheet" href="assets/css/bootstrap.min.css" />
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <div class="video-bg">
        <video width="320" height="240" autoplay loop muted>
            <source src="assets/images/bg.mp4" type="video/mp4" />
            Your browser does not support the video tag.
        </video>
    </div>
    <div class="app">
        <nav class="navbar navbar-expand-lg" data-bs-theme="dark">
            <div class="container">
                <div class="hp-header">
                    <a class="navbar-brand" href="/">
                        <img src="assets/images/logo.svg" alt="" />
                    </a>
                    <div class="search-bar">
                        <input type="text" placeholder="Search" />
                    </div>
                    <div class="nav-item dropdown">
                        <a class="nav-link" data-bs-toggle="dropdown" href="#" role="button" aria-haspopup="true"
                            aria-expanded="false">
                            <div class="notification">
                                <span class="notification-number">3</span>
                                <svg id="Layer_1" data-name="Layer 1" xmlns="http://www.w3.org/2000/svg"
                                    viewBox="0 0 17.67 19.75">
                                    <defs>
                                        <style>
                                            .cls-1 {
                                                fill: none;
                                                stroke: #000;
                                                stroke-linecap: round;
                                                stroke-linejoin: round;
                                            }
                                        </style>
                                    </defs>
                                    <title>notification</title>
                                    <path class="cls-1" d="M12.63,16.75H6.38a3.13,3.13,0,0,0,6.25,0Z"
                                        transform="translate(-0.66 -0.62)" />
                                    <path class="cls-1"
                                        d="M15.75,7.37v4.17L17.19,13a2.15,2.15,0,0,1,.6,1.13,2.24,2.24,0,0,1-.12,1.28,2.22,2.22,0,0,1-2,1.36H3.37a2.22,2.22,0,0,1-2-1.36A2.24,2.24,0,0,1,1.81,13l1.44-1.44V7.37A6.26,6.26,0,0,1,12.5,1.88"
                                        transform="translate(-0.66 -0.62)" />
                                </svg>
                            </div>
                        </a>
                        <div class="dropdown-menu">
                            <a class="dropdown-item" href="#">Notification 1</a>
                            <a class="dropdown-item" href="#">Notification 2</a>
                            <a class="dropdown-item" href="#">Notification 3</a>
                            <div class="dropdown-divider"></div>
                            <a class="dropdown-item" href="#">Separated link</a>
                        </div>
                    </div>
                    <div class="nav-item dropdown hp-profile-bg">
                        <a class="nav-link dropdown-toggle hp-flex-need" data-bs-toggle="dropdown" href="#"
                            role="button" aria-haspopup="true" aria-expanded="false">
                            <div class="user-profile-hp">
                                <img class="profile-img" src="assets/images/user.svg" alt="" />
                                <div class="admin-name-data">
                                    <p>Admin Name</p>
                                    <small>Admin</small>
                                </div>
                            </div>
                        </a>
                        <div class="dropdown-menu">
                            <a class="dropdown-item" href="#">Profile</a>
                            <a class="dropdown-item" href="#">Logout</a>
                        </div>
                    </div>
                </div>
            </div>
        </nav>

        <section class="main-content">
            <div class="container">
                <div class="row">
                    <!-- Button trigger modal -->
                    <button type="button" class="btn btn-primary" data-bs-toggle="modal"
                        data-bs-target="#cognoButtonModel">
                        Button
                    </button>

                    <!-- Modal -->
                    <div class="modal fade" id="cognoButtonModel" data-bs-backdrop="static" data-bs-keyboard="false"
                        tabindex="-1" aria-labelledby="cognoButtonModelLabel" aria-hidden="true">
                        <div class="modal-dialog">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h5 class="modal-title" id="cognoButtonModelLabel">
                                        Add Data
                                    </h5>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal"
                                        aria-label="Close"></button>
                                </div>
                                <div class="modal-body">
                                    <form>
                                        <fieldset>
                                          
                                          <div>
                                            <label for="name" class="form-label mt-4">Name</label>
                                            <input type="text" class="form-control" id="name" placeholder="Enter Your Name">
                                          </div>

                                          <div>
                                            <label for="exampleInputEmail1" class="form-label mt-4">Email address</label>
                                            <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" placeholder="Enter Your email">
                                            <small id="emailHelp" class="form-text text-muted">We'll never share your email with anyone else.</small>
                                          </div>

                                          <div>
                                            <label for="phoneNmuber" class="form-label mt-4">Phone Nmuber</label>
                                            <input type="number" class="form-control" id="phoneNmuber" placeholder="Enter Your Phone Number">
                                          </div>
                                         
                                          <div>
                                            <label for="address" class="form-label mt-4">Address</label>
                                            <textarea class="form-control" id="address" rows="3" placeholder="Enter your address"></textarea>
                                          </div>
                                        </fieldset>
                                      </form>
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                                        Close
                                    </button>
                                    <button type="submit" class="btn btn-primary">
                                        Submit
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</body>

</html>
